# image: docker:24





stages:
  - build
  # - test
  - deploy

build-image-backend:
  stage: build
  image: docker:24
  services:
  - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  
  script: |
    docker info
    docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    docker build -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA ./backend
    docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
  # rules:
  #   - changes: 
  #       - backend/**
  #       - .gitlab-ci.yaml

build-image-frontend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script: |
    docker info
    docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    docker build -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA ./frontend
    docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA
  # rules:
  #   - changes: 
  #       - frontend/**
  #       - gitlab-ci.yaml

deploy-build:
  stage: deploy
  image: 
    name: bitnami/kubectl:latest
    entrypoint: [""]

  tags:
    - self-hosted
  script:
    - kubectl set image deployment/backend backend=$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA -n task-tracker
    - kubectl set image deployment/frontend frontend=$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA -n task-tracker
    - kubectl rollout status deployment/backend -n task-tracker
    - kubectl rollout status deployment/frontend -n task-tracker
    


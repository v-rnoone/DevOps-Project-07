stages:
  - build
  - test
  - deploy

variables:
  X=123
  
build-push job:
  stage: build
  tags:
    - self-hosted
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - echo "$X"
  


validate:
  stage: build
  tags:
    - self-hosted
  needs:
    - compile
  script:
    - echo "validating the code"
    - echo "validation is complete"

security-test:
  stage: test
  image: ubuntu:24.04
  script:
    - echo "Running SonarQube Analysis"

deploy-job:
  stage: deploy
  tags:
    - self-hosted
  script:
    - echo "Deploying"